services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  openmemory-mcp:
    image: mem0/openmemory-mcp:latest
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      - ./vendor/openmemory_memory_utils.py:/usr/src/openmemory/app/utils/memory.py:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8765 --workers 1"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8765/api/v1/apps/')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
